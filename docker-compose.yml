services:
        web:
                image: flyby-backend
                container_name: flyby-backend
                build: .
                env_file:
                        # Create this on the server (copy .env.example -> .env)
                        # It holds SECRET_KEY and the Duffel / Gemini keys.
                        - .env
                ports:
                        - "8659:8659"
                volumes:
                        # Persists the SQLite database, uploads and storage across
                        # rebuilds. Flask's instance path inside the image is
                        # /instance (WORKDIR is /), so the DB lives at
                        # /instance/volumes/flyby.db.
                        - ./instance:/instance
                restart: unless-stopped
