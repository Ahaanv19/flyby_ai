{% extends "layouts/base.html" %}
{% set project = "Not found" %}

{% block style %}
<style>
  .fly-404 {
    min-height: calc(100vh - 62px);
    display: flex; align-items: center; justify-content: center;
    padding: 2rem 1.1rem;
  }
  .fly-404-card { max-width: 460px; text-align: center; padding: 2.6rem 2.2rem; }
  .fly-404-code {
    font-weight: 800; font-size: clamp(3.6rem, 11vw, 5.4rem); line-height: 1; margin: 0;
    letter-spacing: -.04em;
    background: linear-gradient(120deg, #ffffff 0%, #cddffb 50%, var(--fly-cta) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .fly-404-card h2 { font-size: 1.25rem; font-weight: 800; margin: .7rem 0 .4rem; }
  .fly-404-card p { color: var(--fly-muted); margin: 0 0 1.6rem; font-size: .93rem; line-height: 1.6; }
</style>
{% endblock %}

{% block body %}
<div class="fly-404">
  <div class="fly-panel fly-404-card">
    <h1 class="fly-404-code">404</h1>
    <h2>Off the flight path</h2>
    <p>That page isn't part of the Flyby AI backend.</p>
    <a href="{{ url_for('index') }}" class="fly-btn">Back to overview</a>
  </div>
</div>
{% endblock %}
