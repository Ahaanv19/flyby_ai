<!-- Flyby AI — base layout for the operations console.
     Every console page extends this: it sets the shared shell, the design
     tokens (mirrored from the React app so the two read as one product), and
     the navigation bar. -->
<!DOCTYPE HTML>
<html lang="en">

{% set basename = "Flyby AI" %}
{% set tagline = "Corporate travel, without the chaos." %}

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    {% block head %}{% endblock %}

    <style>
        /* Design tokens mirrored from the Flyby AI app (src/index.css): deep
           navy surfaces, amber accent, and the logo's CTA blue. */
        :root {
            --fly-bg: #0b1220;
            --fly-surface: #111a2e;
            --fly-surface-2: #16213a;
            --fly-border: rgba(148, 163, 184, .16);
            --fly-border-strong: rgba(148, 163, 184, .28);
            --fly-text: #e8eefc;
            --fly-muted: #94a3b8;
            --fly-accent: #f59e0b;
            --fly-cta: #7ba1d4;
            --fly-success: #22c55e;
            --fly-danger: #f87171;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--fly-bg);
            color: var(--fly-text);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient wash — pure CSS, so there is no script that can fail to load
           and leave the page flat. */
        #fly-backdrop {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
            background: var(--fly-bg);
        }
        #fly-backdrop::before {
            content: ''; position: absolute; inset: -30%;
            background:
              radial-gradient(closest-side, rgba(123, 161, 212, .20), transparent 70%) 14% 14% / 48% 48%,
              radial-gradient(closest-side, rgba(245, 158, 11, .12), transparent 70%) 84% 10% / 40% 40%,
              radial-gradient(closest-side, rgba(56, 89, 148, .22), transparent 70%) 72% 86% / 44% 44%;
            filter: blur(70px);
            animation: flyDrift 30s ease-in-out infinite alternate;
        }
        @keyframes flyDrift {
            0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
            100% { transform: translate3d(3%, 2%, 0) scale(1.1); }
        }
        @media (prefers-reduced-motion: reduce) {
            #fly-backdrop::before { animation: none; }
        }

        a { color: var(--fly-cta); }

        .fly-wrap { max-width: 1180px; margin: 0 auto; padding: 2.6rem 1.25rem 4rem; }

        /* Shared surface used by cards, panels and tables. */
        .fly-panel {
            background: rgba(17, 26, 46, .72);
            border: 1px solid var(--fly-border);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 36px 70px -44px rgba(0, 0, 0, .85);
        }

        .fly-btn {
            display: inline-flex; align-items: center; gap: .5rem;
            padding: .72rem 1.2rem; border: none; border-radius: 12px;
            font-family: inherit; font-weight: 700; font-size: .94rem;
            color: #0b1220; cursor: pointer; text-decoration: none;
            background: linear-gradient(135deg, var(--fly-accent), #fbbf24);
            box-shadow: 0 14px 30px -14px rgba(245, 158, 11, .85);
            transition: transform .16s ease, box-shadow .16s ease;
        }
        .fly-btn:hover { transform: translateY(-1px); box-shadow: 0 18px 36px -14px rgba(245, 158, 11, .95); }

        .fly-btn-ghost {
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--fly-border-strong);
            color: var(--fly-text);
            box-shadow: none;
        }
        .fly-btn-ghost:hover { background: rgba(255, 255, 255, .09); box-shadow: none; }

        .fly-badge {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .25rem .6rem; border-radius: 999px;
            font-size: .74rem; font-weight: 700; letter-spacing: .02em;
        }
        .fly-badge.ok    { color: #bbf7d0; background: rgba(34, 197, 94, .13); border: 1px solid rgba(34, 197, 94, .32); }
        .fly-badge.warn  { color: #fde68a; background: rgba(245, 158, 11, .13); border: 1px solid rgba(245, 158, 11, .32); }
        .fly-badge.muted { color: var(--fly-muted); background: rgba(148, 163, 184, .1); border: 1px solid var(--fly-border); }
        .fly-badge.admin { color: #dbeafe; background: rgba(123, 161, 212, .16); border: 1px solid rgba(123, 161, 212, .38); }
    </style>

    {% block style %}{% endblock %}

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/flyby-logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/flyby-logo.png') }}">

    <title>{{ basename }} · {{ project }}</title>
</head>

<body>
    <div id="fly-backdrop"></div>

    {% include "layouts/navbar.html" %}

    {% block body %}{% endblock %}
</body>

</html>
